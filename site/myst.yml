# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: "Von Domaros Lab"
  description: "GitHub landing page of the Von Domaros Lab"
  authors:
    - name: "Michael von Domaros"
      affiliation: "Philipps-Universität Marburg"
      email: "mvondomaros@uni-marburg.de"
  github: "https://github.com/orgs/mvondomaros-lab"

site:
  # Pin the theme to a release: the bare name "book-theme" tracks the theme's
  # main branch and breaks the build whenever it outgrows the locked mystmd.
  # To update, pick a release with a book-theme.zip asset from
  # https://github.com/jupyter-book/myst-theme/releases and raise the mystmd
  # minimum in pixi.toml if the build asks for a newer version.
  template: https://github.com/jupyter-book/myst-theme/releases/download/myst-to-react%402.0.0/book-theme.zip
  actions:
    - title: GitHub Repositories
      url: https://github.com/orgs/mvondomaros-lab/repositories
  options:
    hide_toc: true
    favicon: favicon.ico
