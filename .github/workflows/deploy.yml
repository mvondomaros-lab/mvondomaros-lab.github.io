name: Build & Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Build myst site
        working-directory: site
        run: myst build

      - name: Collect myst artifacts
        run: |
          mkdir -p public
          rsync -av site/_build/site/ public/
          touch public/.nojekyll

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexers
        run: |
          python -m pip install --upgrade pip
          pip install conda-index simple503

      - name: Build conda index
        if: ${{ hashFiles('conda/**') != '' }}
        run: |
          mkdir -p public/conda
          rsync -av conda/ public/conda/
          python -m conda_index public/conda

      - name: Build PyPI simple index
        if: ${{ hashFiles('pypi/**') != '' }}
        run: |
          mkdir -p public/pypi
          simple503 --base-url /pypi --sort --copy pypi public/pypi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

