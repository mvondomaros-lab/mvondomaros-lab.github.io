name: Build & Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Myst
        run: npm install -g mystmd

      - name: Build myst site
        working-directory: site
        run: myst build --html

      - name: Collect Myst Artifacts
        run: |
          mkdir -p public
          rsync -av site/_build/html/ public/

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set Up Conda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conda-tools
          create-args: >-
            python=3.11
            conda-index

      - name: Install simple503
        run: |
          python -m pip install --upgrade pip
          pip install simple503

      - name: Build Conda Index
        if: ${{ hashFiles('conda/**') != '' }}
        run: |
          mkdir -p public/conda
          rsync -av conda/ public/conda/
          micromamba run -n conda-tools python -m conda_index public/conda

      - name: Build PyPI Index
        if: ${{ hashFiles('pypi/**') != '' }}
        run: |
          mkdir -p public/pypi
          simple503 --base-url /pypi --sort --copy pypi public/pypi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

