name: Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Build myst site
        working-directory: site
        run: |
          myst build
          mkdir -p public
          rsync -a site/_build/site/ public/

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexers
        run: |
          python -m pip install --upgrade pip
          pip install conda-index simple503

      - name: Build conda index
        if: ${{ hashFiles('conda/**') != '' }}
        run: |
          mkdir -p public/conda
          rsync -a conda/ public/conda/
          conda-index public/conda

      - name: Build pypi index
        if: ${{ hashFiles('pages_src/**') != '' }}
        run: |
          mkdir -p public/pypi
          rsync -a pypi/ public/pypi/
          simple503 public/pypi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public

